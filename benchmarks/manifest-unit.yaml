# P1-4 unit 层 manifest — mini-corpus（5 题型 × 5 = 25 题，全离线）
#
# 字段：
#   id            用例 ID（与 fixtures/ 目录同名）
#   category      web / crypto / pwn / reverse / misc
#   fixture       fixtures/ 下相对 benchmarks/ 的材料目录（含 solve_reference.py 参考解）
#   expected_flag 期望 flag（多平台前缀覆盖：NSSCTF / CTFshow / DASCTF / flag / ISCC
#                 —— P0-1 flag 门修复的回归锁）
#   expect        solved（当前全部期望可解；fixture 跑不通会被 runner 如实标
#                 skipped: fixture-invalid，不许放宽断言）
#   level         static（pwn 层静态分析档：strings/反编译层可解）
#   title/description  题面元信息（进入 solver 查询，mock 层用于 AGENTS.md 构造）
