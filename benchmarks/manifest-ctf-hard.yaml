# 难题 holdout manifest —— 与 manifest-unit.yaml 刻意分开。
#
# 为什么单独一份、单独一个 fixtures-hard/ 目录：
# manifest-unit.yaml 那 25 题是 easy 单元语料，**已经被针对性地改过**，
# 它的数字不再能回答"难不难"。holdout 的全部价值在于"没被调过"，
# 所以它必须物理隔离 —— 让 `git log benchmarks/fixtures-hard/` 一眼可查：
# 这里应当只有新增，任何对已有题面的修改都是污染信号。
#
# 这几题各自测一个**不同的**能力维度，不是同一维度的多个样本：
#   misc-bigscan-01       工具输出纪律（4 MB 输入，整读必丢；但一次 grep 可命中）
#   misc-chunkconcat-01   工具输出纪律·硬档（一次 grep 命中不了，必须落盘再处理）
#   reverse-obfchain-01   调用图推理（3,514 行反编译产物里的死链诱饵）
#   forensics-brutelog-01 交叉判断（"成功"与"来源可信"必须分开看）
#   crypto-keylayers-01   多层推导·逐级依赖（2026-09-13 新增：入口指纹不在盘上，
#                         必须全量计算；每一层的钥匙只在上一层的产物里显形）
#   web-tokenforge-01     协议伪造·密码原语实现保真度（2026-09-14 新增：SECRET 不在盘上，
#                         hashlib 不可续算——必须自实现 SHA-256 压缩函数做长度扩展；
#                         实现保真度是与"多阶段纪律"正交的失败轴）
#
# 字段与 manifest-unit.yaml 一致，额外多一个 solve_reference_steps：
# 参考解的最少步骤数。它是**难度的代理指标**，也是验收时的分母 ——
# solver 的 api_calls 若数倍于它，即使解出也说明路径不经济。
#
# 2026-09-11 起 ctf_path_baseline.py 直接消费这个字段，输出 `×参考解` 列与
# 「路径经济性」汇总。原因：这三题的**解出率会饱和**（首次跑批就 3/3 一次通过），
# 拿"解出率"验收任何优化都没有下降空间。而 api_calls/参考解步数 是连续量 ——
# 题解得出、但绕了 2–4 倍远路，这个位移看得见。**解出率饱和时以它为主指标。**
- id: misc-bigscan-01
  category: misc
  fixture: fixtures-hard/misc-bigscan-01/
  expected_flag: "flag{backup_dir_left_open_2026}"
  expect: solved
  solve_reference_steps: 4
  generator: fixtures-hard/misc-bigscan-01/make_data.py
  title: "长扫描输出里的备份目录"
  description: "4 MB 的 nmap 输出，命中行埋在 65% 深度且不含任何关键字。"
- id: misc-chunkconcat-01
  category: misc
  fixture: fixtures-hard/misc-chunkconcat-01/
  expected_flag: "flag{reassemble_by_seq_not_by_arrival}"
  expect: solved
  solve_reference_steps: 5
  generator: fixtures-hard/misc-chunkconcat-01/make_data.py
  title: "分块传输的重组"
  description: "2.9 MB / 39,382 行传输日志；目标通道 1,379 块乱序散落，过滤输出本身就已超截断线 5.2×。一次 grep 命中不了，必须落盘再处理。"
