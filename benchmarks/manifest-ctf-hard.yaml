  description: "3,514 行 C，40 个同形解码函数，只有一条调用链从 main 可达。"
- id: forensics-brutelog-01
  category: forensics
  fixture: fixtures-hard/forensics-brutelog-01/
  expected_flag: "flag{pivot_from_the_only_external_accept}"
  expect: solved
  solve_reference_steps: 5
  generator: fixtures-hard/forensics-brutelog-01/make_data.py
